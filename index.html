<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer ></script>
    <title>Calendar App</title>
</head>
<body>
    <div class="calendar">
        <div class="header">
            <button type="button" class="prev" aria-label="Previous month" onclick="prevMonth()">&#10094;</button>
            <div class="monthYear" id="monthYear"></div>
            <button type="button" class="next" aria-label="Next month" onclick="nextMonth()">&#10095;</button>
        </div>

        <div class="days">
            <div class="day">Mon</div>
            <div class="day">Tue</div>
            <div class="day">Wed</div>
            <div class="day">Thu</div>
            <div class="day">Fri</div>
            <div class="day">Sat</div>
            <div class="day">Sun</div>
        </div>

        <div class="dates" id="dates"></div>
    </div>

    <button type="button" class="reset" aria-label="Return to current month" onclick="originalMonth()">Reset</button>


</body>
</html>
